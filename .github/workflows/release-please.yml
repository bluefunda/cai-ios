name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_ios:
        description: 'Upload iOS build to App Store Connect'
        type: boolean
        default: true
      deploy_macos:
        description: 'Upload macOS build to App Store Connect'
        type: boolean
        default: true
      version:
        description: 'Version number (e.g. 1.6.3) — required for manual runs'
        required: false

jobs:
  release-please:
    if: github.event_name == 'push'
    uses: bluefunda/.github/.github/workflows/release-please.yml@main
    with:
      release-type: simple
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  ios-deploy:
    name: Archive & Upload iOS to App Store Connect
    needs: [release-please]
    if: |
      always() &&
      (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_ios == true)
      )
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Select Xcode
        run: |
          sudo xcode-select -s $(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer
          xcodebuild -version

      - name: Set version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ needs.release-please.outputs.tag_name }}"
            VERSION="${VERSION#v}"
          fi
          echo "FL_VERSION_NUMBER=$VERSION" >> $GITHUB_ENV
          echo "FL_BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Install distribution certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/cert.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install iOS provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          PP_PATH=$RUNNER_TEMP/ios-profile.mobileprovision
          echo -n "$PROVISIONING_PROFILE" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build & upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPLE_ASC_PRIVATE_KEY }}
        run: bundle exec fastlane ios ios_upload

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

  macos-deploy:
    name: Archive & Upload macOS to App Store Connect
    needs: [release-please]
    if: |
      always() &&
      (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_macos == true)
      )
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Select Xcode
        run: |
          sudo xcode-select -s $(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer
          xcodebuild -version

      - name: Set version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ needs.release-please.outputs.tag_name }}"
            VERSION="${VERSION#v}"
          fi
          echo "FL_VERSION_NUMBER=$VERSION" >> $GITHUB_ENV
          echo "FL_BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Install distribution certificates
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_MAC_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_MAC_INSTALLER_CERTIFICATE }}
          APPLE_MAC_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_MAC_INSTALLER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Apple Distribution — signs the .app bundle itself.
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          # Mac Installer Distribution ("3rd Party Mac Developer Installer") —
          # signs the .pkg installer wrapper the Mac App Store requires. Only
          # macOS needs this second cert; iOS's .ipa export never does.
          echo -n "$APPLE_MAC_INSTALLER_CERTIFICATE" | base64 --decode -o $RUNNER_TEMP/installer-cert.p12
          security import $RUNNER_TEMP/installer-cert.p12 \
            -P "$APPLE_MAC_INSTALLER_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install macOS provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.APPLE_MAC_PROVISIONING_PROFILE }}
        run: |
          PP_PATH=$RUNNER_TEMP/mac-profile.mobileprovision
          echo -n "$PROVISIONING_PROFILE" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build & upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPLE_ASC_PRIVATE_KEY }}
        run: bundle exec fastlane ios mac_upload

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

  commit-version:
    name: Sync released version back to main
    needs: [release-please, ios-deploy, macos-deploy]
    if: |
      always() &&
      (needs.ios-deploy.result == 'success' || needs.macos-deploy.result == 'success')
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Determine released version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ needs.release-please.outputs.tag_name }}"
            VERSION="${VERSION#v}"
          fi
          echo "FL_VERSION_NUMBER=$VERSION" >> $GITHUB_ENV
          echo "FL_BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Bump project.pbxproj to match the released build
        run: |
          bundle exec fastlane run increment_version_number \
            xcodeproj:"CAI.xcodeproj" version_number:"$FL_VERSION_NUMBER"
          bundle exec fastlane run increment_build_number \
            xcodeproj:"CAI.xcodeproj" build_number:"$FL_BUILD_NUMBER"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet CAI.xcodeproj/project.pbxproj; then
            echo "project.pbxproj already matches $FL_VERSION_NUMBER ($FL_BUILD_NUMBER) — nothing to commit"
            exit 0
          fi
          git add CAI.xcodeproj/project.pbxproj
          git commit -m "chore: sync project.pbxproj to $FL_VERSION_NUMBER ($FL_BUILD_NUMBER) [skip ci]"
          git push origin HEAD:main

  release-notes:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: bluefunda/.github/.github/workflows/github-release-notes.yml@main
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
