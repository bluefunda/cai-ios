name: CI
# Distribution builds run via the ios-deploy job in release-please.yml.
# Required repository secrets for that job (not this file):
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_KEYCHAIN_PASSWORD
#   APPLE_PROVISIONING_PROFILE / APPLE_PROVISIONING_PROFILE_NAME
#   APPLE_ASC_KEY_ID / APPLE_ASC_ISSUER_ID / APPLE_ASC_PRIVATE_KEY

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: command -v swiftlint >/dev/null || brew install swiftlint

      - name: SwiftLint
        run: swiftlint lint --quiet --reporter github-actions-logging

  build-test:
    name: Build & Test (iOS)
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # App Store Connect requires the iOS 27 SDK (Xcode 27+) from April 2027 (ITMS-90725).
          # Fail rather than quietly fall back to an older Xcode.
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "No Xcode 27 on this runner:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Prepare simulator
        run: |
          # Any available iPhone simulator — the models differ per Xcode image (Xcode 27's has
          # iPhone 17/18, no iPhone 16). `|| true`: the step runs with `bash -e`, so a grep
          # with no match must not end it before the check below can report what's there.
          SIM_UDID=$(xcrun simctl list devices available | \
            grep -E "iPhone" | head -1 | \
            grep -oE '[A-F0-9]{8}-([A-F0-9]{4}-){3}[A-F0-9]{12}' || true)
          if [ -z "$SIM_UDID" ]; then
            echo "No available simulator found. Available devices:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIM_UDID=$SIM_UDID" >> $GITHUB_ENV
          echo "Using simulator: $(xcrun simctl list devices available | grep $SIM_UDID)"
          xcrun simctl boot $SIM_UDID 2>/dev/null || true
          # Nested virtualization on GitHub-hosted runners makes simulator boot slower and less
          # predictable than on bare-metal Macs. Starting tests before springboard/daemons are
          # fully up is a documented cause of "Restarting after unexpected exit, crash, or test
          # timeout" mid-suite — wait for a real ready signal instead of firing boot and moving on.
          xcrun simctl bootstatus $SIM_UDID -b

      - name: Build & Test
        run: |
          # Pipe through tee so xcodebuild output is visible in the CI log in real-time.
          # PIPESTATUS[0] gives xcodebuild's exit code (not tee's).
          # -parallel-testing-enabled NO: the GitHub-hosted runner doesn't have
          # the CPU/RAM headroom for Xcode's default multi-clone parallel test execution — that
          # was causing random simulator clones to fail to launch mid-suite, failing whichever
          # test happened to be scheduled on them (a different, unrelated test each run).
          # -retry-tests-on-failure: even serial, the constrained runner occasionally hits a
          # simulator/XCTest-host watchdog hang ("Restarting after unexpected exit, crash, or
          # test timeout") with no crash report or assertion behind it — a known class of CI-only
          # flakiness this flag exists specifically to paper over by re-running just the affected
          # test(s) in the same invocation, rather than failing the whole suite.
          rm -rf /tmp/TestResults.xcresult
          xcodebuild \
            -project CAI.xcodeproj \
            -scheme CAI \
            -destination "id=$SIM_UDID" \
            -configuration Debug \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -resultBundlePath /tmp/TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee /tmp/xcode.log
          XCODE_EXIT=${PIPESTATUS[0]}
          # Print a compact summary at the end
          echo "--- Test summary ---"
          grep -E "^(Test Suite|Test Case|error:|Executed|FAILED|PASSED)" /tmp/xcode.log || true
          exit $XCODE_EXIT

      # Only on failure — the "Restarting after unexpected exit, crash, or test timeout" pattern
      # seen intermittently here has no stack trace in the plain text log above. The .xcresult
      # bundle and the host's DiagnosticReports both carry the actual crash report Apple's tools
      # generate for a simulator app termination, which is what's needed to root-cause it for real
      # instead of guessing from log timestamps.
      - name: Collect crash diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/crash-diagnostics
          cp -R /tmp/TestResults.xcresult /tmp/crash-diagnostics/ 2>/dev/null || true
          cp -R ~/Library/Logs/DiagnosticReports /tmp/crash-diagnostics/DiagnosticReports 2>/dev/null || true

      - name: Upload crash diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-crash-diagnostics
          path: /tmp/crash-diagnostics
          retention-days: 5

  build-macos:
    name: Build (macOS / Mac Catalyst)
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # App Store Connect requires the iOS 27 SDK (Xcode 27+) from April 2027 (ITMS-90725).
          # Fail rather than quietly fall back to an older Xcode.
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "No Xcode 27 on this runner:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build for Mac Catalyst
        run: |
          # Unsigned build-only smoke test — catches Catalyst compile/link
          # regressions on every PR without needing a Mac provisioning profile.
          xcodebuild \
            -project CAI.xcodeproj \
            -scheme CAI \
            -destination "generic/platform=macOS,variant=Mac Catalyst" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/xcode-macos.log
          XCODE_EXIT=${PIPESTATUS[0]}
          exit $XCODE_EXIT
