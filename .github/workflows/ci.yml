name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: command -v swiftlint >/dev/null || brew install swiftlint

      - name: SwiftLint
        run: swiftlint lint --quiet --reporter github-actions-logging

  build-test:
    name: Build & Test (iOS)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Prefer the latest stable Xcode 16.x; fall back to whatever is newest
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Prepare simulator
        run: |
          # Find the UDID of any available iPhone 16 (or fall back to any iPhone)
          SIM_UDID=$(xcrun simctl list devices available | \
            grep -E "iPhone 16[^P]" | head -1 | \
            grep -oE '[A-F0-9]{8}-([A-F0-9]{4}-){3}[A-F0-9]{12}')
          if [ -z "$SIM_UDID" ]; then
            SIM_UDID=$(xcrun simctl list devices available | \
              grep -E "iPhone" | head -1 | \
              grep -oE '[A-F0-9]{8}-([A-F0-9]{4}-){3}[A-F0-9]{12}')
          fi
          if [ -z "$SIM_UDID" ]; then
            echo "No available simulator found. Available devices:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIM_UDID=$SIM_UDID" >> $GITHUB_ENV
          echo "Using simulator: $(xcrun simctl list devices available | grep $SIM_UDID)"
          xcrun simctl boot $SIM_UDID 2>/dev/null || true
          # Nested virtualization on GitHub-hosted runners makes simulator boot slower and less
          # predictable than on bare-metal Macs. Starting tests before springboard/daemons are
          # fully up is a documented cause of "Restarting after unexpected exit, crash, or test
          # timeout" mid-suite — wait for a real ready signal instead of firing boot and moving on.
          xcrun simctl bootstatus $SIM_UDID -b

      - name: Build & Test
        run: |
          # Pipe through tee so xcodebuild output is visible in the CI log in real-time.
          # PIPESTATUS[0] gives xcodebuild's exit code (not tee's).
          # -parallel-testing-enabled NO: the default GitHub-hosted macos-15 runner doesn't have
          # the CPU/RAM headroom for Xcode's default multi-clone parallel test execution — that
          # was causing random simulator clones to fail to launch mid-suite, failing whichever
          # test happened to be scheduled on them (a different, unrelated test each run).
          # -retry-tests-on-failure: even serial, the constrained runner occasionally hits a
          # simulator/XCTest-host watchdog hang ("Restarting after unexpected exit, crash, or
          # test timeout") with no crash report or assertion behind it — a known class of CI-only
          # flakiness this flag exists specifically to paper over by re-running just the affected
          # test(s) in the same invocation, rather than failing the whole suite.
          xcodebuild \
            -project CAI.xcodeproj \
            -scheme CAI \
            -destination "id=$SIM_UDID" \
            -configuration Debug \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee /tmp/xcode.log
          XCODE_EXIT=${PIPESTATUS[0]}
          # Print a compact summary at the end
          echo "--- Test summary ---"
          grep -E "^(Test Suite|Test Case|error:|Executed|FAILED|PASSED)" /tmp/xcode.log || true
          exit $XCODE_EXIT

  build-macos:
    name: Build (macOS / Mac Catalyst)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build for Mac Catalyst
        run: |
          # Unsigned build-only smoke test — catches Catalyst compile/link
          # regressions on every PR without needing a Mac provisioning profile.
          xcodebuild \
            -project CAI.xcodeproj \
            -scheme CAI \
            -destination "generic/platform=macOS,variant=Mac Catalyst" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/xcode-macos.log
          XCODE_EXIT=${PIPESTATUS[0]}
          exit $XCODE_EXIT
