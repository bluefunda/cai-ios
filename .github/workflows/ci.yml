name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Use latest available Xcode on the runner
          sudo xcode-select -s $(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer
          xcodebuild -version

      - name: Build (simulator)
        run: |
          xcodebuild \
            -project CAI.xcodeproj \
            -scheme CAI \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build > /tmp/build.log 2>&1
          BUILD_EXIT=$?
          grep -E "^(error:|warning:|note:|Build succeeded|BUILD SUCCEEDED|BUILD FAILED)" /tmp/build.log || true
          exit $BUILD_EXIT

      - name: Test
        run: |
          xcodebuild \
            -project CAI.xcodeproj \
            -scheme CAI \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            test > /tmp/test.log 2>&1
          TEST_EXIT=$?
          grep -E "^(Test Suite|Test Case|error:|Executed|FAILED|PASSED)" /tmp/test.log || true
          exit $TEST_EXIT
