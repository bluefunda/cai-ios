name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Prefer the latest stable Xcode 16.x; fall back to whatever is newest
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Prepare simulator
        run: |
          # Find the UDID of any available iPhone 16 (or fall back to any iPhone)
          SIM_UDID=$(xcrun simctl list devices available | \
            grep -E "iPhone 16[^P]" | head -1 | \
            grep -oE '[A-F0-9]{8}-([A-F0-9]{4}-){3}[A-F0-9]{12}')
          if [ -z "$SIM_UDID" ]; then
            SIM_UDID=$(xcrun simctl list devices available | \
              grep -E "iPhone" | head -1 | \
              grep -oE '[A-F0-9]{8}-([A-F0-9]{4}-){3}[A-F0-9]{12}')
          fi
          if [ -z "$SIM_UDID" ]; then
            echo "No available simulator found. Available devices:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIM_UDID=$SIM_UDID" >> $GITHUB_ENV
          echo "Using simulator: $(xcrun simctl list devices available | grep $SIM_UDID)"
          # Boot it so the first test run doesn't time out on simulator startup
          xcrun simctl boot $SIM_UDID 2>/dev/null || true

      - name: Build (simulator)
        run: |
          xcodebuild \
            -project CAI.xcodeproj \
            -scheme CAI \
            -destination "id=$SIM_UDID" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build > /tmp/build.log 2>&1
          BUILD_EXIT=$?
          grep -E "^error:" /tmp/build.log || true
          if [ $BUILD_EXIT -eq 0 ]; then
            echo "Build succeeded."
          else
            echo "Build FAILED (exit $BUILD_EXIT). Full log:"
            cat /tmp/build.log
          fi
          exit $BUILD_EXIT

      - name: Test
        run: |
          xcodebuild \
            -project CAI.xcodeproj \
            -scheme CAI \
            -destination "id=$SIM_UDID" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            test > /tmp/test.log 2>&1
          TEST_EXIT=$?
          grep -E "^(Test Suite|Test Case|error:|Executed)" /tmp/test.log || true
          if [ $TEST_EXIT -ne 0 ]; then
            echo "Tests FAILED (exit $TEST_EXIT). Full log:"
            cat /tmp/test.log
          fi
          exit $TEST_EXIT
